name: Release

# @group Trigger : Runs when a version tag like v1.0.0 is pushed
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create GitHub Releases
  id-token: write # needed for npm trusted publishing (OIDC)

jobs:
  release:
    name: Build, Publish & Release
    runs-on: ubuntu-latest

    steps:
      # @group Setup : Checkout and Node.js environment
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog generation

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # @group Dependencies : Install root and client deps (single pnpm workspace install)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # @group Build : Build every workspace package (server TS + bin TS + React client)
      - name: Build
        run: pnpm --include-workspace-root -r run build

      # @group Version : Extract tag name for use in later steps
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # @group Publish : Push package to npm registry via trusted publishing (OIDC)
      - name: Publish to npm
        run: npm publish --access public

      # @group Release : Auto-generate changelog from commits since last tag
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            Install or upgrade:
            ```bash
            npm install -g ezpm2gui@npm:@mara-li/ezpm2gui@${{ steps.version.outputs.VERSION }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
